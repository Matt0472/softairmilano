          - { name: text, label: Testo, type: text, description: "Una frase sul perché conviene. Se vuoto non compare" }
          - { name: agesTitle, label: Titolo delle età, type: string, description: "Es. «Età minima». Se vuoto, le età compaiono senza titolo" }
          - name: ages
            label: Età minime
            description: "Una per attività. Devono essere le stesse delle pagine attività: se ne cambi una, aggiornala anche lì. Un'età senza valore o senza attività non compare"
            type: object
            list: { max: 6 }
            fields:
              - { name: value, label: "Età (es. 12+)", type: string }
              - { name: label, label: "Attività (es. Softair)", type: string }

