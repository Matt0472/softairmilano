              - { name: href, label: Link, type: string, description: "Es. #scegli" }
          - { name: ticketNote, label: "Scritta in fondo al disegno del voucher", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, es. «Valido 6 mesi · Data a scelta»: ogni parte separata da «·» va su una riga. Compare anche sul disegno in home. Se cambi la validità, aggiornala anche qui e nel testo della sezione «Voucher regalo» della home. Se vuota non compare" }
          - { name: hudTag, label: "Scritta tattica nella cornice (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in alto a destra (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale), es. «VOUCHER · VALIDO 6 MESI». Se vuota non compare" }
      - name: types
        label: I voucher (schede con i prezzi)
        description: "Una scheda per voucher, una accanto all'altra. Se il titolo è vuoto o non c'è nessuna scheda con nome e prezzo, la sezione non compare"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Scegli il voucher». Se vuoto, la sezione non compare, e con lei l'ancora #scegli: il bottone principale dell'apertura non porta più da nessuna parte" }
          - { name: text, label: Testo, type: text, description: "Una frase, es. che il prezzo è a giocatore. Se vuoto non compare" }
          - { name: includedTitle, label: Titolo dell'elenco in ogni scheda, type: string, description: "Es. «Comprende». Se vuoto, l'elenco compare senza titolo" }
          - name: buy
            label: Acquisto online
            description: "Chi non ha ancora accettato i «Servizi esterni» nel banner dei cookie vede, sopra le schede, un riquadro che spiega che l'acquisto passa da TicketingHub e lo attiva con un clic; dopo, al posto del riquadro compare l'avviso sul pagamento e ogni scheda mostra il suo bottone di acquisto. Riquadro, avviso e messaggio di errore compaiono solo se almeno una scheda ha sia il «Testo del bottone di acquisto» sia l'«ID widget TicketingHub»"
            type: object
            fields:
              - { name: consentText, label: Testo del riquadro di attivazione, type: text, description: "Dice che l'acquisto online è di TicketingHub e che usa cookie di terze parti, es. «L'acquisto online è fornito da TicketingHub e usa cookie di terze parti (statistiche Google). Attivandolo li accetti.». Se vuoto, il riquadro mostra solo i bottoni" }
              - { name: consentButton, label: Bottone di attivazione, type: string, required: true, description: "Es. «Attiva l'acquisto dei voucher». Accetta i «Servizi esterni» e fa comparire i bottoni di acquisto delle schede. Obbligatorio: senza, il riquadro non compare, e chi non ha accettato i «Servizi esterni» non può comprare dalla pagina finché non li accetta dal banner o da «Preferenze cookie» in fondo alla pagina" }
              - { name: preferencesLabel, label: Link alle preferenze cookie, type: string, description: "Es. «Gestisci le preferenze cookie»: riapre le scelte dei cookie. Se vuoto non compare" }
              - { name: paymentNote, label: Avviso sul pagamento, type: text, description: "Una riga con il segno di attenzione, sopra le schede, quando l'acquisto online è attivo: si legge prima di premere un bottone di acquisto, es. «Durante il pagamento, premendo sul pulsante PayPal è possibile pagare anche con carta.». Solo cose vere sul pagamento in TicketingHub. Se vuoto non compare" }
              - { name: failText, label: Messaggio se l'acquisto online non si carica, type: text, required: true, description: "Compare sotto le schede se TicketingHub non risponde (connessione assente, servizio bloccato dal browser), es. «L'acquisto online non si è caricato: chiamaci o scrivici, i contatti sono in fondo alla pagina.». Obbligatorio: senza, chi preme un bottone che non si apre non riceve nessuna spiegazione" }
          - name: items
            label: Schede
            description: "Meglio due: stanno una accanto all'altra. L'ordine della lista è quello della pagina. Una scheda senza nome o senza prezzo non compare"
            type: object
            list: { max: 3 }
            fields:
              - { name: title, label: Nome del voucher, type: string, description: "Es. «Con noleggio attrezzatura». Nome e prezzo compaiono anche in home, nella sezione «Voucher regalo»" }
              - { name: audience, label: Per chi è, type: string, description: "Una frase sotto il nome, es. «Per chi ha già il fucile: nessuna attrezzatura fornita». Se vuota non compare" }
              - { name: price, label: "Prezzo (solo il numero, es. 35)", type: string, description: "Compare in grande nella scheda. Se cambi il prezzo, aggiornalo anche nelle domande frequenti e nella descrizione per Google" }
              - { name: unit, label: "Unità del prezzo (es. € a giocatore)", type: string, description: "Compare accanto al prezzo. Se vuota non compare" }
              - { name: included, label: Cosa comprende, type: string, list: true, description: "Una voce per riga, es. «Fucile con 300 colpi». Una voce vuota non compare; senza voci l'elenco non compare" }
              - { name: note, label: Nota in fondo alla scheda, type: string, description: "Es. «Ricarica extra da 300 colpi: 3 €». Se vuota non compare" }
              - { name: buyLabel, label: Testo del bottone di acquisto, type: string, description: "Dice quale voucher si compra, es. «Partita con noleggio attrezzatura». Il bottone apre l'acquisto online di questo voucher; compare solo a chi ha attivato l'acquisto online (o accettato i «Servizi esterni» nel banner dei cookie) e solo se c'è anche l'ID del widget" }
              - { name: widgetId, label: "ID widget TicketingHub (acquisto)", type: string, description: "Il codice del widget di questo voucher in TicketingHub, fatto di lettere, numeri e trattini, es. ab82c960-e267-465e-85c6-5386327bf60e: nel codice di incorporamento del widget, è il codice tra virgolette dopo \"widgetId\":. Un codice sbagliato fa sì che l'acquisto non si apra: dopo averlo cambiato, provate il bottone sull'anteprima. Se vuoto, la scheda compare senza bottone di acquisto" }
      - name: steps
        label: Come funziona (passo per passo)
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "Facoltativo. Se vuoto non compare" }
          - name: items
            label: Passaggi
            description: "Dall'acquisto alla partita, nell'ordine. Un passaggio senza titolo non compare"
            type: object
            list: true
            fields:
              - { name: time, label: "Momento (facoltativo)", type: string, description: "Se vuoto, compare il numero del passaggio (01, 02…)" }
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
          - { name: rulesTitle, label: Titolo del riquadro delle regole, type: string, description: "Es. «Prima di giocare»" }
          - { name: rules, label: Regole, type: string, list: true, description: "Una per riga, es. «Prenotazione obbligatoria». Le età devono essere quelle delle pagine attività. Compaiono in un riquadro sotto i passaggi; senza regole il riquadro e il link non compaiono" }
          - name: rulesLink
            label: Link sotto il riquadro
            description: "Compare solo se ha sia il testo sia il link"
            type: object
            fields:
              - { name: label, label: Testo, type: string, description: "Es. «Vai alla modulistica»" }
              - { name: href, label: Link, type: string, description: "Es. /modulistica" }
      - name: faq
        label: Domande frequenti
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: items
            label: Domande
            description: "Una domanda senza risposta non compare. Se cambi prezzi o validità, aggiornali anche qui"
            type: object
            list: true
            fields:
              - { name: q, label: Domanda, type: string }
              - { name: a, label: Risposta, type: text }

  - name: blog
    label: Pagina Blog
    description: "La pagina /blog: l'apertura e l'elenco degli articoli, dal più recente. Gli articoli si scrivono in «Blog — articoli»"
    type: file
    path: src/data/blog.json
    fields:
      - { name: published, label: Pagina online, type: boolean, default: true, description: "Spenta: il blog sparisce dal sito, dal menu e da ogni link che ci porta, insieme a tutti i suoi articoli, e chi apre questi indirizzi vede la pagina «non trovata». Gli articoli restano salvati: si riaccende quando vuoi. Vale per il sito pubblicato e per l'anteprima online" }
      - name: seo
        label: SEO e anteprima social
        type: object
        fields:
          - { name: title, label: Titolo della pagina (Google), type: string, description: "Circa 60 caratteri", required: true }
          - { name: description, label: Descrizione (Google), type: text, description: "Circa 155 caratteri" }
          - { name: image, label: Immagine per i social, type: image, description: "Orizzontale, 1200×630 (JPG o PNG). Se vuota si usa l'immagine social predefinita di «Impostazioni generali»" }
          - { name: imageAlt, label: Testo alternativo immagine social, type: string, description: "Descrive l'immagine per i social. Se vuoto si usa il nome del sito" }
      - name: hero
        label: Apertura
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Es. «Guide e consigli». Se vuoto non compare" }
          - { name: title, label: "Titolo principale (H1)", type: string, required: true, description: "Breve, es. «Blog»" }
          - { name: subtitle, label: Sottotitolo (massimo 20 parole), type: text, description: "Di cosa parlano gli articoli. Se vuoto non compare" }
          - { name: hudTag, label: "Scritta tattica nella cornice (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in alto a destra (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale), es. «Guide · Regole · Attrezzatura». Compare anche in cima a ogni articolo. Se vuota non compare" }
      - { name: listTitle, label: Titolo sopra l'elenco degli articoli, type: string, description: "Es. «Tutti gli articoli». Se vuoto non compare: l'elenco segue subito l'apertura" }
      - { name: moreTitle, label: "Titolo degli articoli suggeriti (in fondo a ogni articolo)", type: string, description: "Es. «Altri articoli»: in fondo a ogni articolo, sopra qualche altro articolo da leggere. Vale per tutti gli articoli. Se vuoto, gli articoli suggeriti non compaiono" }
      - { name: readMore, label: Testo del bottone sulle schede, type: string, description: "Es. «Leggi l'articolo»: in fondo a ogni scheda, nell'elenco del blog e negli articoli suggeriti. Tutta la scheda porta all'articolo; se vuoto il bottone non compare" }

  - name: blogPosts
    label: Blog — articoli
    description: "Un file per articolo. Il nome del file è l'indirizzo dell'articolo: softair-sulla-neve → /blog/softair-sulla-neve. Quando crei un articolo il nome si fa dal titolo e puoi accorciarlo prima di salvare; dopo resta quello anche se cambi il titolo. Rinominare il file cambia l'indirizzo: i link già condivisi e quelli su Google smettono di funzionare, quindi non farlo con un articolo già online. Per togliere un articolo dal sito senza perderlo, spegni «Articolo online» invece di cancellarlo"
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, date, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: published, label: Articolo online, type: boolean, default: true, description: "Spento: l'articolo sparisce dall'elenco del blog e dagli articoli suggeriti, e chi apre il suo indirizzo vede la pagina «non trovata». Si riaccende quando vuoi. I link a questo articolo scritti nel testo di altri articoli diventano testo normale da soli. Vale per il sito pubblicato e per l'anteprima online" }
      - { name: title, label: "Titolo dell'articolo (H1)", type: string, required: true, description: "Compare grande in cima all'articolo, nell'elenco del blog e su Google. Quando crei l'articolo diventa anche il nome del file, cioè l'indirizzo (vedi sopra); cambiarlo dopo non cambia l'indirizzo" }
      - { name: description, label: "Riassunto (elenco del blog e Google)", type: text, required: true, options: { maxlength: 160 }, description: "Una o due frasi su cosa trova chi legge: compare sotto il titolo nell'elenco del blog, in apertura dell'articolo e come descrizione su Google. Massimo 160 caratteri" }
      - { name: date, label: Data di pubblicazione, type: date, required: true, options: { format: yyyy-MM-dd }, description: "Compare sull'articolo; nell'elenco del blog in cima c'è il più recente. Per un articolo nuovo è già la data di oggi" }
      - { name: image, label: Immagine di copertina, type: image, description: "Orizzontale 16:9, almeno 1600 px di larghezza (JPG): compare in cima all'articolo, nell'elenco del blog e nelle anteprime sui social. Se vuota, l'articolo compare senza foto e sui social si usa l'immagine predefinita di «Impostazioni generali»" }
      - { name: imageAlt, label: Testo alternativo della copertina, type: string, description: "Obbligatorio se c'è la copertina: una frase che dice cosa si vede, per chi non vede le immagini e per Google, es. «Pallini da softair bianchi sparsi su un tavolo di legno». Senza copertina lascialo vuoto" }
      - { name: body, label: Testo dell'articolo, type: rich-text, description: "I titoli delle sezioni partono dal secondo livello (H2), poi H3: il primo livello è già il titolo dell'articolo. Ogni immagine nel testo ha bisogno del suo testo alternativo. I link alle pagine del sito si scrivono senza dominio, es. /softair o /blog/softair-sulla-neve" }

  - name: cookieBanner
    label: Banner dei cookie
    description: "I testi del banner che compare alla prima visita e della finestra «Preferenze cookie». Le statistiche compaiono solo quando in Impostazioni generali c'è l'ID di Google Analytics"
    type: file
    path: src/data/cookie.json
    fields:
      - name: banner
        label: Banner (prima visita)
        required: true
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo, type: text, description: "Breve e vero: cosa usa il sito e che si può cambiare idea. Niente nomi di servizi che il sito non usa" }
          - { name: acceptAll, label: Bottone «Accetta tutti», type: string, required: true }
          - { name: rejectAll, label: Bottone «Accetta solo essenziali», type: string, required: true, description: "Rifiuta tutto tranne i cookie essenziali. Ha lo stesso peso di «Accetta tutti», come chiede il Garante" }
          - { name: preferences, label: Bottone «Preferenze», type: string, required: true }
      - name: preferences
        label: Finestra «Preferenze cookie»
        required: true
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo introduttivo, type: text, description: "Sotto compaiono da soli i link a privacy e cookie policy del footer" }
          - { name: acceptAll, label: Bottone «Accetta tutti», type: string, required: true }
          - { name: rejectAll, label: Bottone «Accetta solo essenziali», type: string, required: true, description: "Spegne tutto tranne i cookie essenziali e chiude la finestra" }
          - { name: save, label: Bottone «Salva le preferenze», type: string, required: true }
          - { name: close, label: Testo per chiudere la finestra, type: string, required: true, description: "Letto dai lettori di schermo sulla X, es. «Chiudi»" }
      - name: categories
        label: Categorie
        required: true
        type: object
        fields:
          - name: necessary
            label: Necessari (sempre attivi)
            required: true
            type: object
            fields:
              - { name: title, label: Titolo, type: string, required: true }
              - { name: text, label: Descrizione, type: text }
          - name: analytics
            label: Statistiche (Google Analytics)
            required: true
            type: object
            fields:
              - { name: title, label: Titolo, type: string, required: true }
              - { name: text, label: Descrizione, type: text }
          - name: external
            label: Servizi esterni (prenotazione online e mappa)
            required: true
            type: object
            fields:
              - { name: title, label: Titolo, type: string, required: true }
              - { name: text, label: Descrizione, type: text }
      - { name: footerLabel, label: Voce nel footer per riaprire le preferenze, type: string, description: "Es. «Preferenze cookie». Se vuota, la voce non compare" }
      - { name: policyButton, label: Bottone in fondo alla cookie policy, type: string, description: "Es. «Gestisci le preferenze». Se vuoto, il bottone non compare" }

