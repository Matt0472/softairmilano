          - { name: text, label: Frase sotto il titolo, type: string, description: "Una riga, es. «Tutto online, prima di venire». Se vuota non compare" }
          - { name: steps, label: Passaggi, type: string, list: { max: 4 }, description: "Una frase breve per passaggio, nell'ordine: compaiono numerati 01, 02… Un passaggio vuoto non compare" }
