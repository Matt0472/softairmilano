        fields:
          - { name: label, label: Testo, type: string, description: "Lo stesso testo del bottone Prenota nel menu, es. «Prenota»" }
          - { name: href, label: Link, type: string, description: "Es. #prenota" }
      - name: ctaSecondary
        label: Bottone secondario
        description: "Compare solo se ha sia il testo sia il link"
        type: object
        fields:
          - { name: label, label: Testo, type: string, description: "Es. «Torna alla home»" }
          - { name: href, label: Link, type: string, description: "Es. / (la home)" }
      - { name: destinationsTitle, label: "Titolo dell'elenco delle pagine", type: string, description: "Sopra l'elenco delle pagine del sito, che si compone da solo dalle voci del «Menu di navigazione» (con le descrizioni delle attività) e mostra solo le pagine già online. Se vuoto, l'elenco compare senza titolo" }
  - name: contatti
    label: Contatti
    type: file
    path: src/data/contatti.json
    fields:
      - { name: published, label: Pagina online, type: boolean, default: true, description: "Spenta: la pagina sparisce dal sito, dal menu e da ogni link che ci porta, e chi apre il suo indirizzo vede la pagina «non trovata». Si riaccende quando vuoi. Vale per il sito pubblicato e per l'anteprima online" }
      - name: seo
