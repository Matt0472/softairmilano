        description: "Telefono, email, WhatsApp, orari, indirizzo e social sono quelli di «Impostazioni generali»: qui si cambiano solo i testi intorno"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Es. «Arena indoor · Milano». Se vuoto non compare" }
          - { name: title, label: "Titolo principale (H1)", type: string, required: true, description: "Breve, es. «Contatti»: oltre le 14 lettere si stampa più piccolo" }
          - { name: subtitle, label: Sottotitolo (massimo 20 parole), type: text, description: "Se vuoto non compare" }
          - { name: hudTag, label: "Scritta tattica nella cornice (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in alto a destra (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale). Se cambiano gli orari, controlla che dica ancora il vero. Se vuota non compare" }
      - name: labels
