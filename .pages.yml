          - name: ctaSecondary
            label: Bottone secondario
            description: "Compare solo se ha sia il testo sia il link"
            type: object
            fields:
              - { name: label, label: Testo, type: string }
              - { name: href, label: Link, type: string, description: "Es. #come-funziona: porta a «Come si svolge». Se quella sezione non compare, svuota questo bottone" }
          - { name: hudTag, label: "Scritta tattica sulla foto (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in alto a destra sulla foto (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale), es. «TEAM BUILDING · MAX 40». Il numero deve essere quello dei Dati chiave: se li cambi, aggiornala anche qui. Se vuota non compare" }
      - name: facts
        label: Dati chiave (sotto il titolo)
        description: "Da 2 a 4 dati brevi; ognuno si legge di seguito, es. «40 persone al massimo». Un dato senza valore o senza etichetta non compare"
        type: object
        list: { max: 4 }
        fields:
          - { name: value, label: "Valore (es. 40)", type: string }
          - { name: label, label: "Etichetta (es. persone al massimo)", type: string }
      - name: intro
        label: Perché il softair (in breve)
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "La prima frase compare in grande e deve reggersi da sola: è quella che citano Google e gli assistenti AI. Se vuoto, la sezione non compare" }
          - name: points
            label: I valori del softair
            description: "Una voce per valore, es. «Coraggio». Fino a 5. Una voce senza titolo non compare"
            type: object
            list: { max: 5 }
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
      - name: session
        label: Come si svolge (passo per passo)
        description: "Il bottone secondario dell'apertura porta qui (#come-funziona)"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "Durata e arbitraggio, in una frase" }
          - name: steps
            label: Passaggi
            description: "Un passaggio senza titolo non compare"
            type: object
            list: true
            fields:
              - { name: time, label: "Momento (es. Briefing, Missioni)", type: string, description: "Se vuoto, compare il numero del passaggio" }
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
      - name: formats
        label: Le formule
        description: "Una scheda per formula, con il suo simbolo e le sue cifre. Se il titolo è vuoto o non c'è nessuna voce, la sezione non compare"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Facoltativo: meglio vuoto se ripete il titolo" }
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - name: items
            label: Formule
            description: "L'ordine della lista è quello della pagina. Una voce senza nome non compare"
            type: object
            list: true
            fields:
              - { name: title, label: Nome, type: string }
              - { name: text, label: Descrizione (una o due frasi), type: text }
              - name: icon
                label: Icona
                description: "Il simbolo che apre la scheda. Sceglilo per tutte le voci o per nessuna, così le schede restano allineate. Se vuota, la scheda resta senza simbolo"
                type: select
                options:
                  values:
                    - { name: users, label: "Squadra (partite)" }
                    - { name: trophy, label: "Coppa (torneo)" }
                    - { name: target, label: "Bersaglio (arcotag)" }
                    - { name: flag, label: "Bandiera" }
                    - { name: timer, label: "Cronometro" }
                    - { name: map, label: "Mappa" }
              - name: stats
                label: "Cifre (es. 20 persone al massimo)"
                description: "Una cifra compare solo se ha sia il valore sia l'etichetta, e si legge di seguito: «20 persone al massimo». Meglio le stesse cifre, nello stesso ordine, in tutte le formule. I numeri di persone devono essere quelli della domanda «Quante persone possono partecipare?»"
                type: object
                list: true
                fields:
                  - { name: value, label: "Valore (es. 20)", type: string }
                  - { name: label, label: "Etichetta (es. persone al massimo)", type: string }
      - name: onRequest
        label: Su richiesta (opzioni da aggiungere)
        description: "L'ultima riga delle «Tre formule», con quello che si aggiunge a qualunque formula su richiesta, es. il catering. Compare solo se ci sono le formule. Niente prezzi: si danno con il preventivo. Se il titolo è vuoto o non c'è nessuna opzione, la sezione non compare"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Su richiesta». Se vuoto, la sezione non compare" }
          - { name: items, label: Opzioni, type: string, list: true, description: "Una per riga, es. «Catering». Se non ce n'è nessuna, la sezione non compare" }
          - { name: note, label: Nota sotto le opzioni, type: text, description: "Facoltativa, es. «Indicatele nella richiesta di preventivo». Se vuota non compare" }
      - name: clients
        label: Loro hanno scelto noi (loghi delle aziende)
        description: "Il muro di loghi, fermo, subito dopo le formule e «Su richiesta». Se l'elenco è vuoto, la sezione non compare"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Loro hanno scelto noi»" }
          - { name: text, label: Testo, type: text, description: "Una o due frasi sotto il titolo, sui settori delle aziende dell'elenco. Deve restare vero: se togli un'azienda, controlla che il suo settore sia ancora nell'elenco. Se vuoto non compare" }
          - name: items
            label: Aziende
            description: "Solo aziende che hanno davvero giocato da voi. L'ordine della lista è quello del muro: da sinistra a destra, riga per riga"
            type: object
            list: true
            fields:
              - { name: name, label: Nome dell'azienda, type: string, required: true, description: "Scritto come lo scrive l'azienda, es. «MediaWorld». È anche il testo alternativo del logo, e compare al posto del logo se il file manca" }
              - { name: logo, label: Logo, type: image, description: "PNG alto 96 pixel, sfondo trasparente, nei colori del marchio nella versione per fondi scuri: stretto ai lati, con margine sopra e sotto perché sembri grande quanto gli altri (una scritta occupa circa i due terzi dell'altezza, un simbolo quadrato tutta). Nel dubbio, fatelo preparare al tecnico." }
      - name: extras
        label: Attività da abbinare
        description: "Escape room, Enigma Bomb e Mistero di Milano vengono dal vecchio sito e potrebbero non essere più disponibili: verifica che ogni attività dell'elenco ci sia ancora. La sezione compare solo con l'interruttore acceso, un titolo e almeno una voce"
        type: object
        fields:
          - { name: show, label: Mostra le attività combinabili, type: boolean, description: "Acceso: la sezione compare. Se un'attività dell'elenco non è più disponibile, toglila o spegni l'interruttore" }
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo, type: text }
          - name: items
            label: Attività
            description: "Una scheda per attività, con foto, nome, una riga e il link. Una voce senza nome non compare"
            type: object
            list: true
            fields:
              - { name: title, label: Nome, type: string }
              - { name: text, label: Testo, type: text, description: "Una riga, es. «Fino a 40 persone»" }
              - { name: image, label: "Foto (orizzontale, 16:9)", type: image, description: "Compare in alto nella scheda, ritagliata in 16:9: tieni il soggetto e le scritte al centro. Se vuota, la scheda resta senza foto" }
              - { name: imageAlt, label: Testo alternativo foto, type: string, description: "Descrive la foto, comprese le scritte che ci sono sopra" }
              - { name: href, label: Link, type: string, description: "L'indirizzo completo della pagina dell'attività, con https://: la scheda intera diventa un link, che si apre in una nuova scheda e mostra in basso il sito di destinazione. Se vuoto, la scheda non è cliccabile" }
      - name: reviews
        label: Recensioni
        type: object
        fields:
          - { name: title, label: "Titolo (le recensioni si modificano in «Recensioni»)", type: string, description: "Voto e recensioni sono gli stessi in ogni pagina e si cambiano in «Recensioni». Se il titolo è vuoto, la sezione non compare" }
      - name: faq
        label: Domande frequenti
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: items
            label: Domande
            description: "Una domanda senza risposta non compare"
            type: object
            list: true
            fields:
              - { name: q, label: Domanda, type: string }
              - { name: a, label: Risposta, type: text }
      - name: request
        label: Form di richiesta preventivo
        description: "Il form in fondo alla pagina (#richiesta). Campi, messaggi e bottone di invio si modificano in «Form di richiesta» e valgono per tutte le pagine"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Richiedi un preventivo», lo stesso testo del bottone principale dell'apertura. Se vuoto, si usa quello di «Form di richiesta»" }
          - { name: text, label: Testo, type: text, description: "Se vuoto, si usa quello di «Form di richiesta»" }
          - { name: activity, label: Attività già scelta nel form, type: string, description: "Compare nell'elenco «Attività» del form, già selezionata, e nell'oggetto dell'email che ricevete (es. «Richiesta dal sito: Team building»)" }

