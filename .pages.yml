# Configurazione Pages CMS (https://pagescms.org)
# Accesso su https://app.pagescms.org (account GitHub o collaboratore invitato).
# Convenzione: chiavi in inglese, label in italiano; contenuti in src/data/*.json.
# Ogni contenuto del sito deve essere editabile da qui (vedi CLAUDE.md).

settings:
  commit:
    # Ogni salvataggio riporta nome ed email di chi modifica.
    identity: user

media:
  input: public/uploads
  output: /uploads

content:
  - name: settings
    label: Impostazioni generali
    type: file
    path: src/data/settings.json
    fields:
      - { name: siteName, label: Nome sito, type: string }
      - { name: siteUrl, label: URL del sito, type: string }
      - { name: vatNumber, label: Partita IVA, type: string, description: "Solo le cifre: la sigla «P.IVA» la aggiunge il sito. Compare in fondo a ogni pagina, accanto al copyright, ed è obbligatoria per legge sul sito di un'attività. Se vuota non compare" }
      - { name: defaultDescription, label: Descrizione SEO predefinita, type: text }
      - { name: defaultOgImage, label: Immagine social predefinita, type: image, description: "L'anteprima che compare quando qualcuno condivide il sito su WhatsApp, Facebook o LinkedIn, per le pagine che non hanno una loro immagine social. JPG orizzontale 1200×630: i social non mostrano gli SVG" }
      - { name: footerTagline, label: Frase sotto il logo nel footer, type: string }
      - { name: phone, label: Telefono, type: string }
      - { name: whatsapp, label: WhatsApp, type: string, description: "Il numero, scritto come il telefono, es. «375 595 6805». Accende WhatsApp nella sezione Prenota, in Contatti e il bottone WhatsApp in basso a sinistra. Se vuoto, WhatsApp non compare da nessuna parte" }
      - name: whatsappButton
        label: Bottone WhatsApp
        description: "Il bottone tondo con il simbolo di WhatsApp in basso a sinistra, su ogni pagina, da telefono e da computer: compare insieme alla freccia «Torna su», appena si scorre la pagina, e poi resta. Si fa da parte solo mentre sono aperti il banner dei cookie o il menu e mentre si scrive in un campo. Un tocco o un clic apre WhatsApp (da computer, WhatsApp Web in una nuova scheda) sul numero qui sopra, con il messaggio già scritto. Senza il numero WhatsApp non compare"
        type: object
        fields:
          - { name: show, label: Mostra il bottone, type: boolean, default: true, description: "Spento: il bottone sparisce da tutte le pagine. WhatsApp resta nella sezione Prenota e in Contatti" }
          - { name: label, label: "Nome del bottone (per i lettori di schermo)", type: string, required: true, description: "Non si vede: lo legge ad alta voce il lettore di schermo, sul telefono o sul computer, a chi non vede lo schermo. Dice cosa fa il bottone, es. «Scrivici su WhatsApp»" }
          - { name: message, label: Messaggio già scritto, type: text, description: "Il testo che il visitatore trova già scritto in WhatsApp: può cambiarlo prima di inviarlo. Breve, es. «Ciao! Vorrei informazioni per prenotare una partita.». Se vuoto, WhatsApp si apre senza messaggio" }
      - { name: email, label: Email, type: string }
      - { name: address, label: Indirizzo, type: text }
      - name: postalAddress
        label: Indirizzo per Google (campi separati)
        type: object
        fields:
          - { name: streetAddress, label: "Via e numero", type: string }
          - { name: postalCode, label: CAP, type: string }
          - { name: addressLocality, label: Comune, type: string }
          - { name: addressRegion, label: "Provincia (sigla)", type: string }
          - { name: addressCountry, label: "Paese (sigla, es. IT)", type: string }
      - { name: openingHours, label: Orari, type: string, description: "Es. Tutti i giorni dalle 14:00 alle 24:00, solo su prenotazione" }
      - { name: directions, label: Come arrivare, type: string, description: "Parcheggio, mezzi pubblici: una riga breve" }
      - { name: rangerUrl, label: "Link arena outdoor (Ranger Softair)", type: string }
      - name: wear
        label: "Abbigliamento consigliato (pagine attività)"
        description: "Il blocco sotto le note dei prezzi delle pagine attività che non hanno un abbigliamento tutto loro (oggi il Softair; Arcotag, Tiro dinamico e Nerf hanno il proprio, in Prezzi › Abbigliamento). Compare con almeno la frase o una voce dell'elenco; se sono vuote entrambe, non compare. Il titolo vale anche per le attività con il blocco proprio, se lì è vuoto. Le domande frequenti «Cosa devo indossare?» delle pagine si scrivono a parte: se cambi l'elenco, aggiornale"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Abbigliamento consigliato». Se vuoto, compaiono solo la frase e l'elenco" }
          - { name: text, label: Frase sopra l'elenco, type: string, description: "Es. «L'arena non è climatizzata né riscaldata». Se vuota non compare" }
          - { name: items, label: Elenco, type: string, list: true, description: "Un capo per riga, breve, es. «Pantaloni lunghi». Le righe vuote non compaiono" }
      - name: finalCta
        label: "Prenota (fondo di ogni pagina)"
        description: "La sezione «Sei pronto a scendere in campo?» in fondo a ogni pagina tranne quelle legali, uguale ovunque tranne il sottotitolo delle pagine attività. Telefono, WhatsApp, email, orari, indirizzo e «Come arrivare» sono i campi qui sopra; un dato vuoto non compare. La scritta gigante sul fondo è il «Nome sito»"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, required: true, description: "Grande, al centro: le parole salgono una alla volta. Meglio breve, cinque o sei parole" }
          - { name: subtitle, label: Sottotitolo, type: text, description: "Una riga sotto il titolo, in home e su ogni pagina che non ne ha uno suo: meglio una frase che valga per tutte le attività. Le pagine attività hanno il loro (Attività (pagine) › Prenota (fondo pagina)). Se vuoto non compare" }
          - { name: writeLabel, label: "Testo del bottone email", type: string, description: "Es. Scrivi. Se vuoto, il bottone email non compare" }
          - { name: phrases, label: "Parole della fascia inclinata", type: string, list: { max: 8 }, description: "Parole brevi che scorrono nella fascia in basso, es. le attività e «1.500 m²». Se la lista è vuota, la fascia non compare" }
      - name: footerRanger
        label: Colonna arena outdoor nel footer
        description: "Il riquadro sotto il logo che porta al sito del Ranger («Link arena outdoor» qui sopra). Compare solo con il testo del link e il link; titolo e descrizione, se vuoti, non compaiono"
        type: object
        fields:
          - { name: title, label: Titolo colonna, type: string }
          - { name: label, label: Testo del link, type: string }
          - { name: text, label: Descrizione, type: string }
      - name: footerHeadings
        label: Titoli delle colonne nel footer
        description: "Le colonne del menu si fanno da sole dal «Menu di navigazione»: ogni voce con un sottomenu (es. Attività, Info) è una colonna con il suo nome; le voci senza sottomenu (Corso, Team building…) stanno insieme in una colonna sola. «Home» non compare: ci porta già il logo"
        type: object
        fields:
          - { name: pages, label: "Colonna delle voci senza sottomenu", type: string, required: true, description: "Es. Scopri" }
          - { name: contacts, label: Colonna dei contatti, type: string, required: true, description: "Es. Contatti. Telefono, email, indirizzo e orari sono i campi qui sopra; un dato vuoto non compare" }
      - name: footerLegal
        label: Link legali nel footer
        description: "In fondo al footer, accanto al ©: privacy, cookie, termini. Un link senza testo o senza indirizzo non compare"
        type: object
        list: true
        fields:
          - { name: label, label: Testo, type: string }
          - { name: href, label: Link, type: string, description: "Es. /privacy" }
      - { name: ticketinghubId, label: "ID script TicketingHub (prenotazioni)", type: string, description: "Lo fornisce e lo collega il tecnico insieme al widget di prenotazione: finché il collegamento non è fatto, questo campo non ha effetto" }
      - { name: gaMeasurementId, label: "ID Google Analytics (GA4)", type: string, description: "Es. G-XXXXXXXXXX, lo fornisce il tecnico. Google Analytics parte solo per chi lo accetta nel banner dei cookie; se il campo è vuoto, nel banner la voce «Statistiche» non compare" }
      - { name: web3formsKey, label: "Chiave Web3Forms (form di richiesta)", type: string, description: "La chiave dell'account Web3Forms che riceve le richieste dalle pagine attività e da Contatti e le inoltra via email. Se vuota, il form non compare" }
      - name: social
        label: Social (URL dei profili)
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: tiktok, label: TikTok, type: string }

  - name: navigation
    label: Menu di navigazione
    type: file
    path: src/data/navigation.json
    fields:
      - name: items
        label: Voci del menu
        description: "Sul computer le voci principali stanno su una sola riga, accanto al logo e a «Prenota»: tienile poche e con etichette brevi. Una pagina nuova di solito va nel sottomenu di una voce (es. «Attività»), che si allunga verso il basso senza togliere spazio alla riga. Se le voci principali non ci stanno, sui computer con lo schermo più stretto il menu diventa il pulsante «Menu», come sul telefono"
        type: object
        list: true
        fields:
          - { name: label, label: Etichetta, type: string }
          - { name: href, label: Link, type: string, description: "Lascia vuoto se la voce apre un sottomenu" }
          - name: children
            label: Sottomenu (es. le attività)
            type: object
            list: true
            fields:
              - { name: label, label: Etichetta, type: string }
              - { name: href, label: Link, type: string }
              - { name: badge, label: "Badge (es. Il più richiesto)", type: string, description: "Facoltativo: brevissimo" }
              - { name: desc, label: Descrizione di una riga, type: string, description: "Visibile solo nel menu a tendina da computer" }
      - name: cta
        label: Bottone Prenota del menu
        type: object
        fields:
          - { name: label, label: Testo, type: string }
          - { name: href, label: Link, type: string, description: "Es. #prenota: porta alla sezione Prenota della pagina" }

  - name: home
    label: Home
    type: file
    path: src/data/home.json
    fields:
      - name: seo
        label: SEO e anteprima social
        type: object
        fields:
          - { name: title, label: Titolo della pagina (Google), type: string, description: "Circa 60 caratteri. Se vuoto si usa il nome del sito" }
          - { name: description, label: Descrizione (Google), type: text, description: "Circa 155 caratteri: cosa, dove, quando. Se vuota si usa la descrizione predefinita di «Impostazioni generali»" }
          - { name: image, label: Immagine per i social, type: image, description: "Orizzontale, 1200×630 (JPG o PNG). Se vuota si usa l'immagine social predefinita di «Impostazioni generali»" }
          - { name: imageAlt, label: Testo alternativo immagine social, type: string, description: "Descrive l'immagine per i social. Se vuoto si usa il nome del sito" }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: image, label: "Immagine (desktop, 16:9)", type: image, required: true }
          - { name: imageMobile, label: "Immagine (telefono e tablet in verticale, 9:16)", type: image, description: "Verticale, con il soggetto nel terzo alto: la metà bassa ospita i testi. Se vuota, si usa l'immagine per computer" }
          - { name: imageAlt, label: "Testo alternativo immagine (accessibilità/SEO)", type: string }
          - { name: eyebrow, label: "Sopratitolo (fa parte del titolo H1)", type: string, options: { maxlength: 30 }, description: "Riga piccola sopra la frase grande. Google e gli assistenti AI la leggono come inizio del titolo principale: tienici \"softair\" e \"Milano\", es. «Softair indoor a Milano». Se vuota, il titolo è solo la frase grande" }
          - { name: title, label: "Titolo principale (H1): la frase grande", type: string, required: true }
          - { name: subtitle, label: Sottotitolo, type: text }
          - name: ctaPrimary
            label: Bottone principale
            description: "Porta alla sezione Prenota in fondo alla pagina (#prenota). Compare solo se ha sia il testo sia il link"
            type: object
            fields:
              - { name: label, label: Testo, type: string, description: "Lo stesso testo del bottone Prenota nel menu, es. «Prenota»" }
              - { name: href, label: Link, type: string, description: "Es. #prenota: porta alla sezione Prenota di questa pagina" }
          - name: ctaSecondary
            label: Bottone secondario
            description: "Compare solo se ha sia il testo sia il link"
            type: object
            fields:
              - { name: label, label: Testo, type: string }
              - { name: href, label: Link, type: string, description: "Es. #arena: porta alla sezione «L'arena» di questa pagina" }
          - { name: hudTag, label: "Scritta tattica sulla foto (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in basso a destra sulla foto (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale), es. «IND · 1.500 M² · CQB». Solo numeri già scritti nella pagina. Se vuota non compare" }
          - { name: showRating, label: "Mostra il voto Google sotto i bottoni", type: boolean, description: "Stelle, voto e numero di recensioni vengono da «Recensioni» → «Valutazione complessiva» e si cambiano lì. Sui telefoni in orizzontale non compare, per lasciare in vista «Prenota»" }
      - name: video
        label: "Dentro l'azione (video sotto l'hero)"
        description: "Il video è largo da subito e parte da solo, senza audio, appena è a schermo; l'audio si accende con il suo pulsante. Se il video per computer è vuoto, la sezione non compare"
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo, type: text, description: "Una o due righe sopra il video" }
          - { name: videoSrc, label: "Video (computer e tablet): URL Cloudflare R2, .mp4", type: string, description: "Orizzontale e molto largo, come quello attuale (1920×756, circa 2,5:1). Un filmato più alto viene tagliato in alto e in basso, quindi il soggetto va tenuto al centro. Se vuoto, la sezione non compare" }
          - { name: videoSrcMobile, label: "Video (telefono in verticale): URL Cloudflare R2, .mp4", type: string, description: "Facoltativo. Versione verticale 4:5 (es. 604×756) con il soggetto nel terzo alto. Se vuoto, sul telefono in verticale si vede il video orizzontale in una striscia larga, con i pulsanti sotto" }
          - { name: poster, label: "Immagine poster (computer e tablet)", type: image, description: "Un fotogramma del video orizzontale, nello stesso formato: si vede finché il video non parte. Se vuota, al suo posto c'è un riquadro scuro" }
          - { name: videoAlt, label: "Descrizione del video (accessibilità)", type: string, description: "Cosa si vede nel video, in una frase: la legge chi usa un lettore di schermo. Se vuota, si usa il titolo della sezione" }
          - { name: posterMobile, label: "Immagine poster (telefono in verticale)", type: image, description: "Un fotogramma del video verticale, 4:5. Serve solo se c'è il video per telefono; se vuota, si usa il poster orizzontale" }
          - { name: youtubeLabel, label: "Testo del pulsante YouTube", type: string, options: { maxlength: 24 }, description: "Compare sul video, in basso a sinistra, e porta al canale indicato in «Impostazioni generali» → «Social (URL dei profili)» → «YouTube». Se vuoto, si usa il nome del canale preso dall'indirizzo (es. @softairmilano4590), o «YouTube» se l'indirizzo non contiene un nome con la @. Breve: sul telefono un testo più lungo di «@softairmilano4590» viene tagliato con «…». Se l'indirizzo YouTube manca, il pulsante non compare" }
      - name: arena
        label: "L'arena"
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo, type: text }
          - name: stat
            label: Numero in evidenza
            description: "La cifra grande della sezione, es. «1.500» «m²» «al coperto». Se il valore è vuoto la cifra non compare"
            type: object
            fields:
              - { name: value, label: "Valore (solo la cifra)", type: string }
              - { name: unit, label: "Unità di misura", type: string, description: "Accanto alla cifra, es. m²" }
              - { name: label, label: Didascalia, type: string, description: "Sotto la cifra, es. al coperto" }
          - name: features
            label: Caratteristiche
            description: "Quattro stanno su una riga da computer e in due righe da due sul telefono"
            type: object
            list: true
            fields:
              - name: icon
                label: Icona
                description: "Il simbolo sopra la caratteristica. Sceglilo per tutte le voci o per nessuna, così le colonne restano allineate. Se vuota, la caratteristica resta senza simbolo"
                type: select
                options:
                  values:
                    - { name: hangar, label: "Capannone (al coperto)" }
                    - { name: roof, label: "Casa" }
                    - { name: umbrella, label: "Ombrello (con la pioggia)" }
                    - { name: bulb, label: "Lampadina" }
                    - { name: floodlight, label: "Faro (illuminazione)" }
                    - { name: moon, label: "Luna (di sera)" }
                    - { name: cycle, label: "Frecce in cerchio (sempre nuova)" }
                    - { name: layout, label: "Riquadri (scenari)" }
                    - { name: wrench, label: "Chiave inglese (allestimento)" }
                    - { name: speaker, label: "Altoparlante (audio)" }
                    - { name: equalizer, label: "Equalizzatore (musica)" }
                    - { name: note, label: "Nota musicale" }
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
          - name: photos
            label: Foto dell'arena
            description: "Foto vere dell'arena (orizzontali), da 1 a 4, con il soggetto al centro: sul telefono si ritagliano in riquadri più stretti. Una foto senza immagine non compare; se non ce n'è nessuna, la sezione resta senza foto"
            type: object
            list: { max: 4 }
            fields:
              - { name: image, label: Foto, type: image }
              - { name: imageAlt, label: Testo alternativo foto, type: string }
          - name: tour
            label: "Tour a 360° (Google)"
            description: "Il giro virtuale dell'arena su Google: si apre in una nuova scheda. Compare solo se ha sia il testo sia il link"
            type: object
            fields:
              - { name: label, label: Testo del link, type: string, description: "Es. Visita l'arena a 360°" }
              - { name: href, label: Link, type: string, description: "L'indirizzo del tour copiato da Google Maps (le foto a 360° della scheda dell'arena)" }
      - { name: activitiesTitle, label: Titolo sezione attività, type: string, description: "Sopra il racconto delle attività. Se vuoto il titolo non compare, ma le attività sì" }
      - { name: intro, label: Introduzione attività, type: text, description: "Una o due righe sotto il titolo. Facoltativa" }
      - name: activities
        label: Attività
        description: "Una schermata per attività, che si alternano scorrendo la pagina. Un'attività senza titolo o senza immagine non compare"
        type: object
        list: true
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: desc, label: Descrizione, type: text }
          - { name: pills, label: "Etichette (età, modalità…)", type: string, list: true }
          - { name: image, label: "Immagine (desktop)", type: image }
          - { name: imageMobile, label: "Immagine (mobile, verticale 4:5, soggetto al centro) — opzionale", type: image }
          - { name: linkImage, label: "Foto nella galleria «Provate anche» (facoltativa)", type: image, description: "La foto della scheda di questa attività nella galleria in fondo alle altre pagine attività. Se vuota, si usa la foto qui sopra" }
          - { name: linkImageMobile, label: "Foto nella galleria «Provate anche», telefono (facoltativa)", type: image, description: "Verticale. Se vuota, si usa la foto orizzontale della galleria" }
          - { name: imageAlt, label: "Testo alternativo immagine", type: string }
          - name: focus
            label: Dove sta il soggetto della foto
            description: "Quando la foto è più larga della cornice, il lato scelto resta sempre nell'inquadratura. Se non scegli, vale «Al centro»"
            type: select
            options:
              values:
                - { name: center, label: Al centro }
                - { name: left, label: A sinistra }
                - { name: right, label: A destra }
          - { name: label, label: "Testo del bottone", type: string, description: "Es. «Scopri Softair». Il bottone compare solo se ha sia il testo sia il link" }
          - { name: href, label: Link, type: string, description: "La pagina dell'attività, es. /softair" }
      - name: paintballTeaser
        label: Rimando al paintball
        description: "Subito dopo «Le attività». Tutto il riquadro porta al link. Compare solo con titolo, testo del link e link compilati"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - { name: label, label: Testo del link, type: string, description: "Dice dove porta, es. «Softair o paintball: guarda il confronto». Se vuoto, la sezione non compare" }
          - { name: href, label: Link, type: string, description: "Es. /softair-vs-paintball. Se vuoto, la sezione non compare" }
          - { name: image, label: "Immagine (orizzontale)", type: image, description: "Sta a destra del testo e sfuma verso sinistra; sul telefono sta sopra il testo" }
          - { name: imageAlt, label: Testo alternativo immagine, type: string }
      - name: reviews
        label: Recensioni
        type: object
        fields:
          - { name: title, label: "Titolo (le recensioni si modificano in «Recensioni»)", type: string, description: "Voto e recensioni sono gli stessi in ogni pagina e si cambiano in «Recensioni». Se il titolo è vuoto, la sezione non compare" }
      - name: occasions
        label: Occasioni (mosaico di foto)
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - name: cta
            label: Bottone
            type: object
            fields:
              - { name: label, label: Testo, type: string, description: "Es. Prenota. Se vuoto, il bottone non compare" }
              - { name: href, label: Link, type: string, description: "Es. #prenota: porta alla sezione Prenota in fondo alla home" }
          - name: items
            label: Occasioni
            description: "Da 2 a 4 occasioni: quella «In evidenza» diventa la foto grande, col titolo sopra; le altre stanno in fila sotto di lei, nell'ordine della lista, col titolo e la riga sotto la foto. Un'occasione senza titolo o senza foto non compare"
            type: object
            list: { min: 2, max: 4 }
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo (una riga), type: text }
              - { name: image, label: "Foto (orizzontale 3:2)", type: image, description: "Il soggetto al centro: su tablet e telefono la foto in evidenza si vede un po' più larga e perde un filo in alto e in basso" }
              - { name: imageMobile, label: "Foto verticale (4:5) — solo per quella in evidenza", type: image, description: "Facoltativa: sul telefono in verticale la foto in evidenza è alta, col titolo in basso: soggetto nel terzo alto. Se vuota, si usa la foto orizzontale ritagliata" }
              - { name: imageAlt, label: Testo alternativo foto, type: string }
              - { name: href, label: Link (facoltativo), type: string, description: "Se vuoto, la foto non è cliccabile. Metti un link solo verso una pagina che esiste" }
              - { name: featured, label: In evidenza, type: boolean, description: "Una sola occasione in evidenza; se nessuna lo è, la foto grande è la prima" }
      - name: voucher
        label: Voucher regalo (rimando alla pagina del voucher)
        description: "Subito dopo «Occasioni»: il disegno del voucher accanto al titolo, il testo e il bottone verso la pagina «Voucher regalo», dove stanno i prezzi. Il disegno (titolo e scritta) viene da quella pagina e si cambia lì: «Voucher regalo» → «Apertura». Se il titolo è vuoto, la sezione non compare"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Facoltativo, breve, es. «Idea regalo». Se vuoto non compare" }
          - { name: title, label: Titolo, type: string, description: "Es. «Regala una partita di softair». Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "Una o due frasi, solo cose vere del voucher: chi lo riceve sceglie giorno e ora, entro quanto, che va portato stampato. Meglio senza prezzi: stanno nella pagina del voucher, e qui andrebbero aggiornati a mano. Se cambia la validità, aggiornala anche qui. Se vuoto non compare" }
          - name: cta
            label: Bottone verso la pagina del voucher
            type: object
            fields:
              - { name: label, label: Testo, type: string, description: "Es. «Scopri il voucher». Se vuoto (o se è vuoto il link), il bottone non compare" }
              - { name: href, label: Link, type: string, description: "Es. /voucher-regalo" }
      - name: course
        label: Il corso (rimando alla pagina del corso)
        description: "Il titolo, poi una foto con sopra un riquadro che fa da scheda del corso: il testo, i dati chiave e il link alla pagina del corso, che lo spiega per intero. Se il titolo è vuoto, la sezione non compare"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Facoltativo, breve, sopra il titolo. Se vuoto non compare" }
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "In cima al riquadro, una o due frasi: chi insegna, dove, quando" }
          - name: facts
            label: Dati chiave
            description: "Da 2 a 4, nel riquadro sopra la foto (due per riga da tablet in su). Solo dati veri del corso: giorno e orario, età, prova, attrezzatura. Un dato senza valore non compare"
            type: object
            list: { min: 2, max: 4 }
            fields:
              - { name: value, label: "Dato (breve, in grande)", type: string, description: "Es. Ogni mercoledì" }
              - { name: label, label: "Dettaglio (sotto, più piccolo)", type: string, description: "Es. Dalle 21:00 alle 22:30" }
          - name: cta
            label: Link alla pagina del corso
            type: object
            fields:
              - { name: label, label: Testo, type: string, description: "Es. Scopri il corso. Se vuoto (o se è vuoto il link), il link non compare" }
              - { name: href, label: Link, type: string, description: "Es. /corso-softair" }
          - { name: image, label: "Foto (orizzontale)", type: image, description: "Il soggetto al centro o un po' a destra: da computer il riquadro copre il quarto destro della foto, sul telefono il suo bordo in basso. Se vuota, il riquadro sta da solo sotto il titolo" }
          - { name: imageAlt, label: Testo alternativo foto, type: string }
      - name: social
        label: Social
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "I link ai profili si cambiano in «Impostazioni generali» → «Social (URL dei profili)». Un profilo senza link non compare; se nessun profilo ha un link, la sezione non compare" }
      - name: rangerTeaser
        label: Rimando arena outdoor (Ranger)
        description: "Un riquadro con foto, tutto cliccabile: porta al sito del Ranger, che si cambia in «Impostazioni generali» → «Link arena outdoor»: il nome del sito in ambra sotto il testo (es. rangersoftairmilano.it) si ricava da quel link. Se il link è vuoto, la sezione non compare"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string, description: "Nomina l'altra arena, es. «Ranger Softair Milano · arena all'aperto»: chi legge (e Google) capisce subito che il bosco non è questa arena. Se vuoto non compare" }
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - { name: image, label: "Foto del riquadro (orizzontale)", type: image, description: "Su computer sta dietro al testo e il lato sinistro deve restare scuro; su telefono e tablet sta in alto nel riquadro, ritagliata a 3:2 con il soggetto al centro" }
          - { name: imageMobile, label: "Foto del riquadro (telefono)", type: image, description: "Facoltativa: sul telefono sta in alto nel riquadro, ritagliata a 3:2, con il soggetto al centro. Se vuota, si usa la foto orizzontale" }
          - { name: imageAlt, label: Testo alternativo immagine, type: string }

  - name: testimonials
    label: Recensioni
    type: file
    path: src/data/testimonials.json
    fields:
      - name: rating
        label: Valutazione complessiva
        type: object
        fields:
          - { name: label, label: "Giudizio (es. Eccellente)", type: string }
          - { name: value, label: "Voto medio (es. 4.7)", type: number, options: { min: 1, max: 5, step: 0.1 }, description: "Se vuoto, le stelle non compaiono" }
          - { name: count, label: "Numero di recensioni (es. 500+)", type: string, description: "Non si aggiorna da solo: copialo dal profilo Google quando cresce. Compare nell'apertura della home (se attivata) e in ogni sezione recensioni. Se è vuoto, non compare neanche la fonte" }
          - { name: source, label: "Fonte (es. recensioni su Google)", type: string }
          - { name: url, label: Link alla pagina delle recensioni, type: string }
          - { name: trustindexUrl, label: "Link a Trustindex (tutte le recensioni)", type: string, description: "La pagina Trustindex di SoftAir Milano: compare in ogni sezione recensioni, in fondo al riquadro del voto, con il testo del campo qui sotto, e si apre in una nuova scheda. Se vuoto, il link non compare" }
          - { name: trustindexLabel, label: "Testo del link a Trustindex", type: string, description: "Es. «Leggi tutte le recensioni su Trustindex». Il link compare solo con il testo e l'indirizzo compilati" }
      - name: items
        label: Recensioni
        description: "Solo recensioni vere, copiate da Google. Se togli una parte in mezzo, segna il punto con […]; puoi anche far partire la citazione più avanti o fermarla prima della fine. Compaiono tutte, uguali in ogni pagina, su due file che scorrono accanto al riquadro del voto: la 1ª, la 3ª, la 5ª… nella fila in alto, le altre in quella in basso"
        type: object
        list: true
        fields:
          - { name: author, label: "Autore (nome e iniziale del cognome)", type: string }
          - { name: text, label: "Testo (breve, al massimo 250 caratteri circa)", type: text, description: "Tutte le schede hanno la stessa altezza: un testo più lungo si vede tagliato con «…» (chi usa un lettore di schermo lo sente per intero)" }

  - name: activities
    label: Attività (pagine)
    type: collection
    path: src/data/activities
    format: json
    filename:
      template: "{primary}.json"
      field: create
    view:
      primary: name
    fields:
      - { name: published, label: Pagina online, type: boolean, default: true, description: "Spenta: la pagina dell'attività sparisce dal sito, dal menu, dalla home, da «Provate anche» e da ogni link che ci porta, e chi apre il suo indirizzo vede la pagina «non trovata». Si riaccende quando vuoi. Vale per il sito pubblicato e per l'anteprima online" }
      - { name: name, label: Nome attività, type: string, required: true, description: "Alla creazione diventa l'indirizzo della pagina (es. arcotag → /arcotag); cambiarlo dopo non cambia l'indirizzo. Nomi riservati: paintball, contatti e le altre pagine del menu" }
      - name: seo
        label: SEO e anteprima social
        type: object
        fields:
          - { name: title, label: Titolo della pagina (Google), type: string, description: "Circa 60 caratteri", required: true }
          - { name: description, label: Descrizione (Google), type: text, description: "Circa 155 caratteri" }
          - { name: image, label: Immagine per i social, type: image }
          - { name: imageAlt, label: Testo alternativo immagine social, type: string, description: "Se vuoto si usa quello dell'apertura" }
      - name: hero
        label: Apertura
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string }
          - { name: title, label: "Titolo principale (H1)", type: string, required: true }
          - { name: subtitle, label: Sottotitolo (massimo 20 parole), type: text }
          - { name: image, label: "Immagine (desktop, 16:9)", type: image, required: true }
          - { name: imageMobile, label: "Immagine (mobile, verticale)", type: image }
          - { name: imageAlt, label: Testo alternativo immagine, type: string, required: true }
          - name: focus
            label: Dove sta il soggetto della foto (desktop)
            description: "«A destra» se la foto lascia libera la parte sinistra per il titolo: su portatili e schermi più stretti il soggetto resta nell'inquadratura. Se non scegli, vale «Al centro»"
            type: select
            options:
              values:
                - { name: center, label: Al centro }
                - { name: right, label: A destra }
          - name: ctaPrimary
            label: Bottone principale
            description: "Compare anche sotto i prezzi"
            type: object
            fields:
              - { name: label, label: Testo, type: string }
              - { name: href, label: Link, type: string }
          - name: ctaSecondary
            label: Bottone secondario
            type: object
            fields:
              - { name: label, label: Testo, type: string }
              - { name: href, label: Link, type: string }
          - { name: hudTag, label: "Scritta tattica sulla foto (HUD)", type: string, options: { maxlength: 32 }, description: "Breve, in maiuscolo da sola, in alto a destra sulla foto (non compare sotto i 641 px di larghezza, cioè sui telefoni in verticale), es. «CQB · MAX 20 GIOCATORI · 12+». I numeri devono essere quelli dei Dati chiave: se li cambi, aggiornala anche qui. Se vuota non compare" }
      - name: facts
        label: Dati chiave (sotto il titolo)
        type: object
        list: true
        fields:
          - { name: value, label: "Valore (es. 30 o 12+)", type: string }
          - { name: label, label: "Etichetta (es. giocatori)", type: string }
      - name: intro
        label: In breve
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - name: points
            label: Punti forti
            type: object
            list: true
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
      - name: evening
        label: Come funziona (passo per passo)
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string }
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - name: steps
            label: Passaggi
            type: object
            list: true
            fields:
              - { name: time, label: "Momento (es. Arrivo, Briefing, In campo)", type: string, description: "Se vuoto, compare il numero del passaggio" }
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
              - name: link
                label: Link sotto il testo (facoltativo)
                description: "Es. «Vai alla modulistica» → /modulistica nel passaggio dell'arrivo. Compare solo con testo e link"
                type: object
                fields:
                  - { name: label, label: Testo del link, type: string }
                  - { name: href, label: Link, type: string, description: "Una pagina del sito, es. /modulistica" }
      - name: modes
        label: Missioni / Percorsi
        description: "Le missioni (softair) o i percorsi (tiro dinamico). Compare dopo la sezione con foto ed elenco («Come si gioca» o «Sicurezza e attrezzatura»). Se il titolo è vuoto o non c'è nessuna voce, la sezione non compare"
        type: object
        fields:
          - { name: eyebrow, label: Sopratitolo, type: string }
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - { name: numbered, label: "Numera le voci (01, 02…)", type: boolean, description: "Solo se l'ordine conta, come nei percorsi del tiro dinamico, dove il Beta si sblocca dopo l'Alfa" }
          - name: items
            label: Missioni o percorsi
            description: "L'ordine della lista è quello della pagina (e della numerazione, se attiva). Una voce senza nome non compare"
            type: object
            list: true
            fields:
              - { name: title, label: Nome, type: string }
              - { name: text, label: Descrizione (una o due frasi), type: text }
              - name: icon
                label: Icona
                description: "Il simbolo che apre la scheda della missione o del percorso. Sceglilo per tutte le voci o per nessuna, così le schede restano allineate. Se vuota, la scheda resta senza simbolo"
                type: select
                options:
                  values:
                    - { name: flag, label: "Bandiera (cattura)" }
                    - { name: crosshair, label: "Mirino (eliminazione)" }
                    - { name: crown, label: "Corona (l'ultimo in piedi)" }
                    - { name: shieldUser, label: "Scudo con persona (scorta)" }
                    - { name: bomb, label: "Ordigno (disinnesco)" }
                    - { name: castle, label: "Fortezza (difesa)" }
                    - { name: target, label: "Bersaglio (precisione)" }
                    - { name: users, label: "Squadra (a squadre)" }
                    - { name: timer, label: "Cronometro (a tempo)" }
              - name: stats
                label: "Cifre (facoltative, es. 7 tappe)"
                description: "Una cifra compare solo se ha sia il valore sia l'etichetta, e si legge di seguito: «16 bersagli ravvicinati»"
                type: object
                list: true
                fields:
                  - { name: value, label: "Valore (es. 7)", type: string }
                  - { name: label, label: "Etichetta (es. tappe)", type: string }
      - name: howto
        label: Sezione con foto ed elenco (es. Come si gioca)
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - { name: includedTitle, label: Titolo elenco incluso, type: string }
          - { name: included, label: Cosa è incluso, type: string, list: true }
          - { name: image, label: "Immagine (verticale, 4:5)", type: image }
          - { name: imageAlt, label: Testo alternativo immagine, type: string }
      - name: audiences
        label: Per chi è
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: items
            label: Occasioni
            type: object
            list: true
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: text, label: Testo, type: text }
              - { name: href, label: Link (facoltativo), type: string, description: "Se vuoto, la scheda non è cliccabile. Metti un link solo verso una pagina che esiste o verso #prenota" }
              - { name: featured, label: In evidenza, type: boolean, description: "Una sola occasione in evidenza: con tre occasioni diventa la scheda grande" }
      - name: pricing
        label: Prezzi
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text }
          - name: tiers
            label: Fasce di prezzo
            type: object
            list: true
            fields:
              - { name: label, label: Nome, type: string }
              - { name: when, label: "Quando / per chi", type: string }
              - { name: price, label: "Prezzo (solo il numero)", type: string }
              - { name: unit, label: "Unità (es. € a persona)", type: string }
              - { name: note, label: Nota, type: string, description: "Breve, sotto il prezzo, es. «Minimo 8 quote». Se vuota non compare" }
              - { name: badge, label: "Badge (facoltativo, es. Serata tra amici)", type: string, description: "Mette in risalto la fascia: meglio una sola" }
          - name: players
            label: Numero di giocatori
            description: "Un blocco con il suo titolo prima delle note: quanti giocatori servono e come si gioca con altri gruppi. Se il testo è vuoto non compare (e la regola va nelle note)"
            type: object
            fields:
              - { name: title, label: Titolo, type: string, description: "Es. «Numero di giocatori»" }
              - { name: text, label: Testo, type: text }
          - { name: notes, label: Note sotto i prezzi, type: string, list: true, description: "Una per riga. Sotto le note compare il blocco sull'abbigliamento: quello di questa attività, qui sotto, oppure, se è vuoto, quello generale di Impostazioni generali" }
          - name: wear
            label: Abbigliamento (solo per questa attività)
            description: "Il blocco sotto le note dei prezzi, quando questa attività chiede un abbigliamento diverso da quello generale (es. arcotag, Nerf e tiro dinamico: basta un abbigliamento comodo). Compare con almeno il testo o una voce dell'elenco; se sono vuoti entrambi, compare il blocco generale di Impostazioni generali › Abbigliamento consigliato. Se cambi il testo, aggiorna anche la domanda «Cosa devo indossare?» della pagina"
            type: object
            fields:
              - { name: title, label: Titolo, type: string, description: "Facoltativo. Se vuoto, si usa il titolo di Impostazioni generali › Abbigliamento consigliato" }
              - { name: text, label: Testo, type: text, description: "Una o due frasi, es. «Abbigliamento comodo, da scegliere in base alla temperatura». Se testo ed elenco sono vuoti, compare il blocco generale" }
              - { name: items, label: Elenco, type: string, list: true, description: "Facoltativo: un capo per riga, breve. Le righe vuote non compaiono" }
      - name: reviews
        label: Recensioni
        type: object
        fields:
          - { name: title, label: "Titolo (le recensioni si modificano in «Recensioni»)", type: string, description: "Voto e recensioni sono gli stessi in ogni pagina e si cambiano in «Recensioni». Se il titolo è vuoto, la sezione non compare" }
      - name: faq
        label: Domande frequenti
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: items
            label: Domande
            type: object
            list: true
            fields:
              - { name: q, label: Domanda, type: string }
              - { name: a, label: Risposta, type: text }
      - name: related
        label: Altre attività
        description: "Le schede mostrate sono le attività di Home › Attività (tranne questa), nell'ordine scelto qui sotto"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: order
            label: Attività da mostrare per prime (facoltativo)
            description: "Le schede che vengono per prime, in quest'ordine: trascinale per cambiarlo. Le altre attività seguono nell'ordine di Home › Attività, quindi non serve elencarle tutte e non ne sparisce mai nessuna. Se vuoto, l'ordine è quello di Home › Attività. Questa stessa pagina, le ripetizioni e le attività che non sono in Home › Attività non contano"
            type: reference
            list: true
            options:
              collection: activities
              # The page link comes from the file name (arcotag.json → /arcotag), like the route:
              # the activity's name can change later, its address cannot.
              value: "{path}"
              label: "{primary}"
      - name: finalCta
        label: Prenota (fondo pagina)
        description: "La sezione «Sei pronto a scendere in campo?»: titolo, contatti e fascia sono quelli di Impostazioni generali › Prenota, uguali ovunque. Qui solo il sottotitolo di questa attività"
        type: object
        fields:
          - { name: subtitle, label: Sottotitolo, type: text, description: "Es. «Prenota la tua sessione di arcotag a Milano.». Se vuoto, si usa il sottotitolo di Impostazioni generali › Prenota" }

