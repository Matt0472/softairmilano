          - { name: hours, label: Sopra gli orari, type: string, description: "Es. «Orari»" }
          - { name: address, label: Sopra l'indirizzo, type: string, description: "Es. «Indirizzo»" }
          - { name: social, label: Prima dei social, type: string, description: "Es. «Seguici». I social sono quelli di «Impostazioni generali»" }
      - name: directions
        label: Come raggiungerci (mappa e indicazioni)
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - { name: text, label: Testo, type: text, description: "Una frase sotto il titolo: dove si trova l'arena" }
          - name: map
            label: Mappa
            description: "La mappa di Google si carica solo quando il visitatore preme il bottone: prima compare un riquadro con il nome del sito, l'indirizzo di «Impostazioni generali» e il bottone. Senza indirizzo o senza testo del bottone, la mappa non compare"
            type: object
            fields:
              - { name: button, label: Testo del bottone, type: string, description: "Breve, es. «Mostra la mappa»" }
              - { name: note, label: Nota sotto il bottone, type: string, description: "Dice che la mappa è di Google e si carica solo se la si apre. Se vuota non compare" }
              - { name: frameTitle, label: Nome della mappa per i lettori di schermo, type: string, description: "Non si vede: lo legge ad alta voce il programma di chi non vede, es. «Mappa di Google con la posizione di SoftAir Milano». Se vuoto si usano nome del sito e indirizzo" }
              - { name: openLabel, label: Testo del link a Google Maps, type: string, description: "Sotto la mappa, apre l'indirizzo in Google Maps in una nuova scheda, es. «Apri in Google Maps». Se vuoto non compare" }
          - name: car
            label: In auto
            description: "Compare solo con titolo e testo"
            type: object
            fields:
              - { name: title, label: Titolo, type: string, description: "Es. «In auto»" }
              - { name: text, label: Testo, type: text, description: "Parcheggio e come arrivare in auto. Scrivi solo cose vere e verificate" }
              - { name: routeLabel, label: Testo del link al percorso, type: string, description: "Apre Google Maps con il percorso fino all'indirizzo, es. «Calcola il percorso». Se vuoto non compare" }
          - name: transit
            label: Con i mezzi
            description: "Compare solo con titolo e testo"
            type: object
            fields:
              - { name: title, label: Titolo, type: string, description: "Es. «Con i mezzi»" }
              - { name: text, label: Testo, type: text, description: "Metro, autobus e fermate. Se cambia una linea, aggiorna anche «Come arrivare» in «Impostazioni generali»" }
          - name: outdoor
            label: L'arena all'aperto (Ranger)
            description: "Per chi cerca l'arena nel bosco, che è in un altro posto. Il link è «Link arena outdoor (Ranger Softair)» e il suo testo è «Testo del link» di «Colonna arena outdoor nel footer», in «Impostazioni generali». Compare solo con titolo, testo e link"
            type: object
            fields:
              - { name: title, label: Titolo, type: string, description: "Es. «Cerchi l'arena all'aperto?»" }
              - { name: text, label: Testo, type: text }
      - name: form
        label: Form di contatto
        description: "Il form è lo stesso di «Form di richiesta» (campi, bottone, messaggi, e il sopratitolo se compilato); qui cambiano solo titolo e testo. Qui l'attività parte da «Altro» e l'email che ricevi dice che arriva da /contatti"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Scrivici». Se vuoto si usa il titolo di «Form di richiesta»" }
          - { name: text, label: Testo, type: text, description: "Se vuoto si usa il testo di «Form di richiesta»" }
      - name: faq
        label: Domande frequenti
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Se vuoto, la sezione non compare" }
          - name: items
            label: Domande
            description: "Domande pratiche prima di venire: prenotare, annullare, cosa portare. Non scrivere qui telefono o email: sono già nella pagina. Una domanda senza risposta non compare"
            type: object
            list: true
            fields:
              - { name: q, label: Domanda, type: string }
              - { name: a, label: Risposta, type: text }

  - name: modulistica
    label: Modulistica
