          - { name: url, label: Link del modulo online, type: string, description: "L'indirizzo completo, con https:// (oggi il modulo su forms.monday.com). Si apre in una nuova scheda" }
      - name: minors
        label: Scheda «Minorenni»
        description: "La scheda di destra: il modulo da stampare. Compare solo se ha il titolo"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, description: "Es. «Minorenni»" }
          - { name: text, label: Frase sotto il titolo, type: string, description: "Una riga, es. «Su carta, firmato da un genitore». Se vuota non compare" }
          - { name: steps, label: Passaggi, type: string, list: { max: 4 }, description: "Una frase breve per passaggio, nell'ordine: compaiono numerati 01, 02… Un passaggio vuoto non compare" }
          - { name: ctaLabel, label: Testo del bottone, type: string, description: "Es. «Scarica il modulo». Il bottone compare solo se ha sia il testo sia il file" }
          - { name: file, label: Modulo da stampare (PDF), type: file, options: { extensions: [pdf] }, description: "Per aggiornarlo carica qui il nuovo PDF: il formato e il peso accanto al bottone (es. «PDF, 242 KB») si aggiornano da soli" }
      - name: ready
        label: Arrivare pronti ed età minime
        description: "La sezione sotto le schede. Compare se ha il titolo o almeno un'età"
