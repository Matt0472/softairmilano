# Tells IndexNow (Bing, Yandex, Seznam, Naver, Yep) about the site's pages after every publish, so
# search engines come back within hours instead of days. Google does not take part: Search Console
# covers Google.
#
# Runs on every push to main that touches the site, including saves from the CMS (Pages CMS commits
# to main). The ping goes out only once the new version is live, otherwise the engine comes by and
# finds the old one: the job waits for the "Cloudflare Pages" check of the same commit to turn green.
#
# It sends every address in the sitemap: a few dozen pages and a few publishes a week, far under
# IndexNow's limits, and a change to a shared part (menu, footer, settings) touches every page
# anyway. Pages switched off are not in the sitemap.
#
# The key is public by design: a file with the same name sits at the site root (public/). If the
# domain ever changes, update SITE here too.

name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'

# Several CMS saves in a row: only the last one counts, the earlier runs are cancelled while they
# wait for their deploy.
concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  checks: read

env:
  SITE: https://softairmilano.it
  INDEXNOW_KEY: 3490f3c455fee11b2c0fb4492715e1fd

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the Cloudflare Pages deploy to be live
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 50); do
            result=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages")][0] | "\(.status) \(.conclusion)"')
            echo "attempt $attempt: $result"
            case "$result" in
              "completed success")
                echo "live=yes" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed*)
                # Failed or cancelled deploy: the Cloudflare check already reports it, here we just
                # skip the ping.
                echo "::warning::Deploy did not succeed ($result): IndexNow not notified"
                echo "live=no" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::The deploy did not finish within 12.5 minutes"
          exit 1

      - name: Ping IndexNow with every page in the sitemap
        if: steps.deploy.outputs.live == 'yes'
        run: |
          # A network hiccup (connection reset, timeout) is retried before the run gives up.
          fetch() { curl -sSf --retry 4 --retry-all-errors --retry-delay 10 --max-time 30 "$@"; }
          locs() { grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//'; }
          urls=$(fetch "$SITE/sitemap-index.xml" | locs | while read -r map; do fetch "$map" | locs; done)
          count=$(printf '%s\n' "$urls" | grep -c .)
          [ "$count" -gt 0 ] || { echo "::error::The sitemap lists no pages"; exit 1; }
          echo "Pages: $count"
          body=$(printf '%s\n' "$urls" | jq -R . | jq -s --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" \
            --arg loc "$SITE/$INDEXNOW_KEY.txt" '{host: $host, key: $key, keyLocation: $loc, urlList: .}')
          status=$(curl -sS --retry 4 --retry-all-errors --retry-delay 10 --max-time 30 -o response.txt -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          cat response.txt; echo
          echo "IndexNow: HTTP $status"
          # 200 = received, 202 = received, key validation pending
          case "$status" in
            200|202) ;;
            *) echo "::error::IndexNow answered $status"; exit 1 ;;
          esac
